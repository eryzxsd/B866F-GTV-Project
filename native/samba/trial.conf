[global]
server role = standalone server
workgroup = WORKGROUP
netbios name = B866FGTV
server string = B866F GTV Project
security = user
passdb backend = smbpasswd:/data/adb/modules/ebs_gtv_system_app/samba/private/smbpasswd
private dir = /data/adb/modules/ebs_gtv_system_app/samba/private
state directory = /data/adb/modules/ebs_gtv_system_app/samba/state
cache directory = /data/adb/modules/ebs_gtv_system_app/samba/cache
lock directory = /data/adb/modules/ebs_gtv_system_app/samba/lock
pid directory = /data/adb/modules/ebs_gtv_system_app/samba/run
ncalrpc dir = /data/adb/modules/ebs_gtv_system_app/samba/ncalrpc
log file = /data/adb/modules/ebs_gtv_system_app/samba/log/smbd.log
max log size = 128
logging = file
log level = 1
dbwrap_tdb_mutexes:* = no
server min protocol = SMB2_02
server max protocol = SMB3
server signing = mandatory
ntlm auth = ntlmv2-only
map to guest = Never
restrict anonymous = 2
interfaces = lo wlan0 eth0
bind interfaces only = yes
hosts allow = 127.0.0.1 192.168.1.0/24
load printers = no
printing = bsd
printcap name = /dev/null
disable spoolss = yes
unix extensions = no
wide links = no
follow symlinks = no
nt acl support = no
store dos attributes = no
map archive = no

[Shared]
path = /storage/emulated/0/Shared
browseable = yes
read only = yes
guest ok = no
valid users = shell
force user = shell
force group = media_rw
follow symlinks = no

[USB]
path = /mnt/media_rw
browseable = yes
read only = yes
guest ok = no
valid users = shell
force user = shell
force group = media_rw
follow symlinks = no
